<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | RaktaSetu</title><link rel="stylesheet" href="/css/style.css"><meta name="_csrf" th:content="${_csrf.token}"></head><body><header class="top"><a class="logo" href="/">🩸 <span>RaktaSetu</span></a><a href="/login">Login</a></header><main class="auth-layout"><section class="auth-card"><h2>Create Your Account</h2><p>Join RaktaSetu and be a part of the lifesaving community.</p><form id="registerForm"><div class="tabs"><label><input type="radio" name="role" value="DONOR" checked> Donor</label><label><input type="radio" name="role" value="REQUESTER"> Requester</label></div><label>Full Name<input required name="name" placeholder="Enter your full name"></label><label>Email<input required name="email" type="email" placeholder="Enter your email"></label><label>Mobile Number<input name="mobile" inputmode="tel" placeholder="Mobile number"></label><label>City<input required name="city" placeholder="e.g. Dehradun"></label><label>State<input name="state" placeholder="e.g. Uttarakhand"></label><label id="bloodField">Blood Group<select name="bloodGroup"><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label><label>Password (at least 8 characters)<input required minlength="8" type="password" name="password"></label><label>Confirm Password<input required minlength="8" type="password" name="confirm"></label><button type="submit" class="btn full">Register</button><p id="message" class="feedback" role="status"></p></form><p class="center">Already have an account? <a href="/login">Login</a></p></section><aside class="auth-side"><div class="side-icon">🩸</div><h2>Donate Blood<br>Save Lives</h2><p>“A small act of kindness can make a big difference.”</p></aside></main><script src="/js/app.js"></script></body></html>
