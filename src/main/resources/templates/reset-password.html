<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | RaktaSetu</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><a class="logo" href="/">🩸 <span>RaktaSetu</span></a><a href="/login">Login</a></header><main class="auth-layout"><section class="auth-card"><h2>Set New Password</h2><p th:unless="${valid}">This reset link is invalid, expired or has already been used. <a href="/forgot-password">Request a new link</a>.</p><div th:if="${valid}"><p>Choose a password with at least 12 characters.</p><p class="feedback" th:if="${error}" th:text="${error}"></p><form method="post" action="/reset-password"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}"><label>New Password<input required type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label>Confirm Password<input required type="password" name="confirmPassword" minlength="12" maxlength="128" autocomplete="new-password"></label><button type="submit" class="btn full">Reset Password</button></form></div><p class="center"><a href="/login">Back to login</a></p></section><aside class="auth-side"><div class="side-icon">♥</div><h2>RaktaSetu</h2><p>Protect your account with a unique password.</p></aside></main></body></html>
