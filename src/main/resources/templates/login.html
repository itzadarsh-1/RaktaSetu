<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | RaktaSetu</title><link rel="stylesheet" href="/css/style.css"><meta name="_csrf" th:content="${_csrf.token}"></head><body><header class="top"><a class="logo" href="/">🩸 <span>RaktaSetu</span></a><a href="/register">Register</a></header><main class="auth-layout"><section class="auth-card"><h2>Welcome Back</h2><p>Login to your account</p><form method="post" action="/perform-login"><div class="tabs muted"><span>Donor</span><span>Requester</span><span>Admin</span></div><label>Email<input required name="email" type="email" placeholder="Enter your email"></label><label>Password<input required name="password" type="password" placeholder="Enter your password"></label><input id="csrfLogin" type="hidden" name="_csrf" th:value="${_csrf.token}"><p class="feedback" id="loginStatus"></p><button class="btn full" type="submit">Login</button></form><p class="center">Don't have an account? <a href="/register">Register</a></p></section><aside class="auth-side"><div class="side-icon">♥</div><h2>Need Blood?<br>We are here to help.</h2><p>Find donors near you or register to donate blood.</p></aside></main><script src="/js/app.js"></script></body></html>
