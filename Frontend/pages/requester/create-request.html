<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Blood Request - RaktaSetu</title>

    <link
        rel="stylesheet"
        href="../../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../../css/requester.css"
    >

</head>


<body>


    <!-- Navbar -->

    <header class="dashboard-navbar">

        <div class="dashboard-logo">

            <span class="logo-icon">+</span>

            <span>RaktaSetu</span>

        </div>


        <nav class="dashboard-nav">

            <a href="../donor/donor-dashboard.html">
                Dashboard
            </a>

            <a href="create-request.html" class="active">
                Create Request
            </a>

        </nav>


        <div class="dashboard-actions">

            <button
                id="themeToggle"
                class="theme-toggle"
            >
                🌙
            </button>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- Main -->

    <main class="request-form-container">


        <section class="request-form-header">

            <p class="page-label">
                EMERGENCY BLOOD SUPPORT
            </p>

            <h1>
                Create Blood Request
            </h1>

            <p>
                Enter the required details to find
                a blood donor during an emergency.
            </p>

        </section>



        <!-- Form -->

        <section class="request-form-card">


            <form id="bloodRequestForm">


                <!-- Patient -->

                <div class="form-section">

                    <h2>Patient Information</h2>

                    <div class="form-grid">


                        <div class="form-group">

                            <label for="patientName">
                                Patient Name
                            </label>

                            <input
                                type="text"
                                id="patientName"
                                placeholder="Enter patient name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="bloodGroup">
                                Required Blood Group
                            </label>

                            <select
                                id="bloodGroup"
                                required
                            >

                                <option value="">
                                    Select Blood Group
                                </option>

                                <option value="A+">A+</option>
                                <option value="A-">A-</option>

                                <option value="B+">B+</option>
                                <option value="B-">B-</option>

                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>

                                <option value="O+">O+</option>
                                <option value="O-">O-</option>

                            </select>

                        </div>


                    </div>

                </div>



                <!-- Location -->

                <div class="form-section">

                    <h2>Request Details</h2>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="Example: Dehradun"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="requiredDate">
                                Required Date
                            </label>

                            <input
                                type="date"
                                id="requiredDate"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="emergencyLevel">
                                Emergency Level
                            </label>

                            <select
                                id="emergencyLevel"
                                required
                            >

                                <option value="">
                                    Select Emergency Level
                                </option>

                                <option value="High">
                                    🚨 High
                                </option>

                                <option value="Medium">
                                    ⚠ Medium
                                </option>

                                <option value="Low">
                                    Low
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="contact">
                                Contact Number
                            </label>

                            <input
                                type="tel"
                                id="contact"
                                placeholder="10-digit mobile number"
                                maxlength="10"
                                required
                            >

                        </div>


                    </div>

                </div>



                <!-- Message -->

                <div class="form-section">

                    <h2>Additional Information</h2>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            rows="5"
                            placeholder="Enter any additional information..."
                        ></textarea>

                    </div>

                </div>



                <!-- Submit -->

                <div class="form-submit">

                    <button
                        type="submit"
                        class="create-request-btn"
                    >
                        🩸 Create Blood Request
                    </button>

                </div>


            </form>


        </section>


    </main>



    <script src="../../js/main.js"></script>

    <script src="../../js/requester.js"></script>


</body>

</html>
