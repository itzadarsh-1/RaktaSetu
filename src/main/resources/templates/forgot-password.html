<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | RaktaSetu</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="top"><a class="logo" href="/">🩸 <span>RaktaSetu</span></a><a href="/login">Login</a></header><main class="auth-layout"><section class="auth-card"><h2>Forgot Password?</h2><p>Enter the email you registered with. We will send a reset link to that inbox.</p><p class="feedback" th:if="${message}" th:text="${message}"></p><p class="feedback" th:if="${mailError}" th:text="${mailError}"></p><form method="post" action="/forgot-password"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><label>Registered Email<input required type="email" maxlength="254" name="email" placeholder="you@example.com" autocomplete="email"></label><button type="submit" class="btn full">Email Reset Link</button></form><p class="center"><a href="/login">Back to login</a></p></section><aside class="auth-side"><div class="side-icon">♥</div><h2>Reset securely</h2><p>Reset links expire in 15 minutes and can be used only once.</p></aside></main></body></html>
