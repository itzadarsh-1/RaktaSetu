
# RaktaSetu Application
spring.application.name=RaktaSetu
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/raktasetu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Error Handling
server.error.include-message=never

# Email reset link: configure real sender Gmail and an App Password using environment variables.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
raktasetu.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
raktasetu.base-url=${APP_BASE_URL:http://localhost:8080}



logging.level.org.springframework.security=INFO



spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=INFO
logging.level.com.sun.mail=INFO
